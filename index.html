    <script type="application/ld+json">

            "name": "Talha Salman Portfolio",
            "inLanguage": "en",
            "publisher": { "@id": "https://talhaportfolio.dpdns.org/#person" }

          {
            "@type": "Person",
            "@id": "https://talhaportfolio.dpdns.org/#person",
            "name": "Talha Salman",
            "url": "https://talhaportfolio.dpdns.org/",
            "image": "https://talhaportfolio.dpdns.org/preview.png",

              "Express.js",
              "MongoDB",
              "Tailwind CSS",
              "PHP",
              "HTML5",
              "CSS3",
              "REST API"
            ],
            "sameAs": [
              "https://github.com/talha2343",
              "https://www.linkedin.com/in/m-talha-salman-66832839b"
